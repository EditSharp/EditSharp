# Builds the API reference with DocFX and pushes it to EditSharp/editsharp.github.io,
# which GitHub Pages serves at https://editsharp.github.io.
# DOCS_DEPLOY_KEY is the private half of an SSH key added as a write deploy key on that repo.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g docfx
      - run: docfx docs/docfx.json

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: EditSharp/editsharp.github.io
          publish_branch: main
          publish_dir: docs/_site
          commit_message: Docs for ${{ github.sha }}
