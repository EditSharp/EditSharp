# Packs EditSharp and pushes it to nuget.org with Trusted Publishing: no stored API key.
# nuget.org exchanges this run's GitHub identity token for a short-lived key, per the
# trusted publishing policy on the CoolBean64 account (owner EditSharp, repo EditSharp, workflow nuget.yml).
# Only a pushed tag like v0.2.0 publishes a release (0.2.0); ordinary commits publish nothing.
# Running the workflow by hand from the Actions tab publishes <Version>-ci.<run number> as a prerelease.
name: NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $base = ([xml](Get-Content EditSharp.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$base-ci.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - run: dotnet pack EditSharp.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o out

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: CoolBean64

      # the push command doesn't expand a wildcard path on Windows, so each package is passed by name
      - name: Push
        shell: pwsh
        run: |
          Get-ChildItem out -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
